name: CI

# **`paths-ignore` was removed on 2026-10-02, the day it was added.** The
# repository went public, so Actions minutes are unmetered and the entire
# reason for the filter — roughly five hours a month spent running Playwright
# against prose — is gone.
#
# **What forced the removal rather than merely permitting it: branch
# protection.** GitHub documents that a workflow skipped by a path filter
# leaves its checks **pending**, and a pull request requiring them is blocked
# from merging. So the filter and required status checks cannot coexist, and
# **protection is the stronger of the two** — `CLAUDE.md` records that branch
# protection *"would enforce this; its absence does not prevent it"*, and it
# can now enforce it.
#
# **The cost is wall time, not money**: a documentation-only change now waits
# for the full suite rather than merging immediately. That is the trade, and it
# is worth it for a gate that holds without being remembered.
#
# `architecture.md` §12.7. The superseded reasoning is §12.2's neighbour in the
# git history of this file, deliberately not deleted from the record there.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, types, unit tests, build
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders. The app reads these at request time, and every
      # page is dynamic because it touches cookies, so nothing real is needed to
      # produce a build.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Build
        run: npm run build

  integration:
    name: Integration and end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start Supabase
        run: npx supabase start

      - name: Write environment
        run: npm run db:env

      - name: Integration tests
        run: npm run test:integration

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The integration suite truncates albums and artists between cases and
      # again on the way out, so it hands the end-to-end suite an empty
      # catalogue. Anything that opens an album page needs this, and without it
      # the failure looks like a broken page rather than missing data.
      - name: Seed the fixture catalogue for end-to-end tests
        run: npm run db:seed:fixtures

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
