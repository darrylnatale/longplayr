name: CI

# Documentation does not reach the build, so it does not need a 23-minute run.
#
# **Measured 2026-09-25**: 14 of the last 40 commits on `main` touched only
# `docs/` or markdown, and each fired the full suite — roughly five hours a
# month of a 33-hour allowance spent running Playwright against prose. The
# allowance ran out on 24 September with a week of the month still to go.
# `docs/product-feedback.md` F-056 carries the arithmetic.
#
# **What this gives up, stated rather than glossed.** `format:check` runs
# Prettier over markdown, so a badly formatted document is no longer caught
# here. `npm run verify` still catches it locally at STEP F.
#
# **It saves less than it looks.** A `pull_request` paths filter is evaluated
# against the whole PR diff rather than the latest push, so documentation
# committed inside a code PR still runs the full suite — which is correct. The
# saving lands on documentation-only pushes to `main` and on wholly
# documentation pull requests.
#
# **Nothing under `src/` or `scripts/` imports or reads markdown**, verified
# before this filter was added. If that ever changes — MDX content, a
# markdown-driven route — this filter has to change with it, or CI will skip
# the change that needed it most.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, types, unit tests, build
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders. The app reads these at request time, and every
      # page is dynamic because it touches cookies, so nothing real is needed to
      # produce a build.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Build
        run: npm run build

  integration:
    name: Integration and end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start Supabase
        run: npx supabase start

      - name: Write environment
        run: npm run db:env

      - name: Integration tests
        run: npm run test:integration

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The integration suite truncates albums and artists between cases and
      # again on the way out, so it hands the end-to-end suite an empty
      # catalogue. Anything that opens an album page needs this, and without it
      # the failure looks like a broken page rather than missing data.
      - name: Seed the fixture catalogue for end-to-end tests
        run: npm run db:seed:fixtures

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
